<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دعوت‌نامه جشنواره</title>
    <style>
        * { box-sizing: border-box; font-family: 'Tahoma', 'Segoe UI', sans-serif; }
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            padding: 20px;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            max-width: 500px;
            width: 100%;
            text-align: center;
            transition: all 0.3s;
        }
        h1 { color: #333; font-size: 1.5rem; margin-bottom: 20px; }
        input {
            width: 80%;
            padding: 12px;
            margin: 15px 0;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 1.1rem;
            text-align: center;
            letter-spacing: 2px;
            outline: none;
        }
        input:focus { border-color: #667eea; }
        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.3s;
            width: 80%;
        }
        button:hover { background: #764ba2; }
        .error { color: #e74c3c; font-size: 0.9rem; margin-top: 10px; min-height: 20px; }
        .guest-name {
            font-size: 1.8rem;
            font-weight: bold;
            color: #667eea;
            margin: 20px 0;
            padding: 10px;
            border-bottom: 2px dashed #ddd;
        }
        .invitation-text { text-align: right; line-height: 2; font-size: 1rem; color: #444; }
        .hidden { display: none; }
        .loading { color: #f39c12; font-size: 0.9rem; margin-top: 10px; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
</head>
<body>

    <div class="container" id="loginPage">
        <h1>به جشنواره ۶ ماهه نخست ۱۴۰۵ خوش آمدید</h1>
        <p>برای مشاهده دعوت‌نامه شخصی خود، لطفاً کد ملی ۱۰ رقمی خود را وارد کنید.</p>
        <input type="text" id="nationalCode" placeholder="کد ملی ۱۰ رقمی" maxlength="10" inputmode="numeric">
        <button onclick="checkCode()">مشاهده دعوت‌نامه</button>
        <p id="errorMsg" class="error"></p>
        <p id="loadingMsg" class="loading hidden">در حال بررسی...</p>
    </div>

    <div class="container hidden" id="invitationPage">
        <h1>دعوت‌نامه رسمی</h1>
        <div class="guest-name" id="guestName">...</div>
        <div class="invitation-text">
            <p>بدینوسیله از شما برای حضور در جشنواره ۶ ماهه نخست ۱۴۰۵ دعوت به عمل می‌آید.</p>
            <p>زمان: [تاریخ]</p>
            <p>مکان: [آدرس]</p>
            <p>با احترام، مدیریت شرکت</p>
        </div>
        <button onclick="goBack()" style="margin-top: 20px; background: #95a5a6;">بازگشت</button>
    </div>

    <script>
        const ENCRYPTED_FILE = 'guests.enc';
        const SECRET_KEY = 'MySecretPass2026'; // باید دقیقاً با رمز پایتون یکی باشد (بعد از ljust در پایتون، همین ۱۶ کاراکتر اول استفاده می‌شود)

        async function checkCode() {
            const codeInput = document.getElementById('nationalCode');
            const errorMsg = document.getElementById('errorMsg');
            const loadingMsg = document.getElementById('loadingMsg');
            const code = codeInput.value.trim();

            if (!/^\d{10}$/.test(code)) {
                errorMsg.textContent = 'لطفاً یک کد ملی ۱۰ رقمی معتبر وارد کنید.';
                return;
            }

            errorMsg.textContent = '';
            loadingMsg.classList.remove('hidden');

            try {
                const response = await fetch(ENCRYPTED_FILE);
                if (!response.ok) throw new Error('فایل داده‌ها یافت نشد.');
                const arrayBuffer = await response.arrayBuffer();

                // IV = 16 بایت اول، بقیه ciphertext
                const iv = new Uint8Array(arrayBuffer.slice(0, 16));
                const ciphertext = new Uint8Array(arrayBuffer.slice(16));

                // تبدیل به WordArray
                const ivWordArray = CryptoJS.lib.WordArray.create(iv);
                const ciphertextWordArray = CryptoJS.lib.WordArray.create(ciphertext);

                // کلید: باید دقیقاً ۱۶ بایت باشد (مثل پایتون)
                let keyStr = SECRET_KEY;
                while (keyStr.length < 16) keyStr += ' ';
                keyStr = keyStr.substring(0, 16);
                const key = CryptoJS.enc.Utf8.parse(keyStr);

                // رمزگشایی
                const decrypted = CryptoJS.AES.decrypt(
                    { ciphertext: ciphertextWordArray },
                    key,
                    { iv: ivWordArray, mode: CryptoJS.mode.CBC, padding: CryptoJS.pad.Pkcs7 }
                );

                const jsonString = decrypted.toString(CryptoJS.enc.Utf8);
                if (!jsonString) throw new Error('رمزگشایی ناموفق بود.');

                const guests = JSON.parse(jsonString);
                const guest = guests.find(g => g.national_code === code);

                if (guest) {
                    document.getElementById('loginPage').classList.add('hidden');
                    document.getElementById('invitationPage').classList.remove('hidden');
                    document.getElementById('guestName').textContent = guest.first_name + ' ' + guest.last_name;
                } else {
                    errorMsg.textContent = 'کد ملی وارد شده در لیست دعوت‌شدگان یافت نشد.';
                }

            } catch (err) {
                console.error(err);
                errorMsg.textContent = 'خطا در بررسی اطلاعات. لطفاً بعداً تلاش کنید.';
            } finally {
                loadingMsg.classList.add('hidden');
            }
        }

        function goBack() {
            document.getElementById('loginPage').classList.remove('hidden');
            document.getElementById('invitationPage').classList.add('hidden');
            document.getElementById('nationalCode').value = '';
            document.getElementById('errorMsg').textContent = '';
        }

        document.getElementById('nationalCode').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') checkCode();
        });
    </script>
</body>
</html>
